# CreatorPulse weekly creator report — configuration
# Everything a run needs lives here so the pipeline is re-runnable with one command.

channel:
  handle: "@mkbhd"                         # used by yt-dlp / YouTube Data API
  channel_id: "UCBJycsmduvYEL83R_U4JriQ"   # MKBHD's public channel id
  display_name: "MKBHD"

ingest:
  max_videos: 60            # how many recent uploads to pull
  # Order of ingest attempts. The first that succeeds wins; provenance is recorded.
  #   yt-dlp      -> live public scrape (no API key needed)
  #   youtube-api -> YouTube Data API v3 (set YOUTUBE_API_KEY)
  #   fixture     -> bundled sample snapshot (offline / CI / sandbox)
  prefer: ["yt-dlp", "youtube-api", "fixture"]

# ---------------------------------------------------------------------------
# Calibration for the SYNTHETIC owner-only analytics layer.
# These are PUBLICLY-PLAUSIBLE ranges for an established tech channel, NOT real
# MKBHD analytics. Every number produced from these knobs is labeled synthetic.
# Sources for the ranges are documented in docs/DECISIONS.md.
# ---------------------------------------------------------------------------
synthetic:
  seed: 42                  # deterministic output for reproducible reports
  ctr:                      # click-through rate on impressions (%)
    mean: 6.5
    std: 1.4
    floor: 3.0
    ceil: 11.0
  avg_view_pct:             # average percentage of video watched (%)
    mean: 46.0
    std: 6.0
  retention:
    intro_drop_pct: 22.0    # typical audience lost in first ~30s
    tail_floor_pct: 30.0    # roughly where a strong video plateaus
  demographics:
    gender: {male: 86, female: 12, other: 2}
    age_buckets:
      "13-17": 4
      "18-24": 31
      "25-34": 38
      "35-44": 16
      "45-54": 7
      "55+": 4
    geography:              # top countries by % of views
      "United States": 34
      "India": 11
      "United Kingdom": 8
      "Canada": 6
      "Germany": 4
      "Australia": 3
      "Other": 34
  traffic_sources:         # % of views by discovery surface
    "Browse features": 31
    "Suggested videos": 28
    "YouTube search": 19
    "External": 9
    "Channel pages": 6
    "Notifications": 4
    "Other": 3
  ab_tests:
    tests_per_week: 2       # thumbnail/title/packaging experiments logged per week

analysis:
  anomaly_z: 2.0            # |z| above this on a weekly metric is flagged
  significance_alpha: 0.05  # two-proportion z-test threshold for A/B lift
  # Minimum RELATIVE CTR lift (|%|) a test must clear to count as a winner/loser.
  # At synthetic impression volumes almost any difference is "significant", so we
  # also require a meaningful effect size. Significant-but-below-threshold tests
  # are reported as "inconclusive (small effect)". See docs/DECISIONS.md.
  min_lift_pct: 5.0

report:
  weeks: 8                  # size of the trailing window the report covers
  model: "claude-sonnet-4-5-20250929"
  use_llm: true             # false -> deterministic template narrative (no API)
